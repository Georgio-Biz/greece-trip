<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E5C74" />
<title>Greece 2026 — Batsinilas Family</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    /* ---- Aegean editorial palette ---- */
    --paper:#FAF7F1;        /* warm limestone */
    --paper-2:#F3EEE5;      /* recessed */
    --card:#FFFFFF;
    --ink:#132A34;          /* deep sea ink */
    --ink-2:#4C6675;
    --ink-3:#8299A5;
    --line:#E8E0D3;
    --line-2:#D6CCBB;

    --sea:#0E5C74;          /* primary aegean */
    --sea-2:#12809E;
    --sea-wash:#E8F1F4;
    --athens:#1D6FA5;
    --kythera:#0E8A8B;
    --mani:#7C8A3C;
    --sun:#C4703C;          /* terracotta */
    --gold:#A8842F;
    --green:#2F7D4F;
    --rose:#B04A46;

    --shadow-s:0 1px 2px rgba(19,42,52,.06), 0 1px 3px rgba(19,42,52,.05);
    --shadow-m:0 2px 4px rgba(19,42,52,.04), 0 8px 24px rgba(19,42,52,.07);
    --shadow-l:0 4px 8px rgba(19,42,52,.05), 0 20px 48px rgba(19,42,52,.11);

    --serif:ui-serif,"New York",Iowan Old Style,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:18px;
    --scheme:"light";   /* read by JS so the map basemap always matches the CSS */
  }
  @media (prefers-color-scheme: dark){
    :root{
      --scheme:"dark";
      --paper:#0E1A20; --paper-2:#152730; --card:#152730;
      --ink:#EDF3F5; --ink-2:#A8BEC8; --ink-3:#7691A0;
      --line:#223A45; --line-2:#2E4A57;
      --sea:#4FB3D0; --sea-2:#6FC9E2; --sea-wash:#16323D;
      --athens:#5AA5DA; --kythera:#3FC0C1; --mani:#AFBE68;
      --sun:#E0946A; --gold:#D4B45F; --green:#5FBF88; --rose:#E08480;
      --shadow-s:0 1px 3px rgba(0,0,0,.4);
      --shadow-m:0 8px 24px rgba(0,0,0,.45);
      --shadow-l:0 20px 48px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;height:100dvh;background:var(--paper);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    font-size:15px;line-height:1.55}
  a{color:var(--sea)}

  /* ================= HEADER ================= */
  header{position:relative;padding:14px 20px 12px;background:var(--card);
    border-bottom:1px solid var(--line);z-index:10}
  header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:linear-gradient(90deg,var(--athens),var(--kythera) 45%,var(--mani) 78%,var(--sun))}
  .brand{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .h-title{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
  .h-kick{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);
    padding:3px 8px;border:1px solid var(--line-2);border-radius:6px}
  .h-sub{font-size:12.5px;color:var(--ink-2);margin-top:4px;letter-spacing:-.003em}

  /* ================= NAV ================= */
  nav{background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:9}
  .seg{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;padding:8px 14px;margin:0 auto;max-width:1040px}
  .seg::-webkit-scrollbar{display:none}
  .seg button{scroll-snap-align:start;flex:0 0 auto;appearance:none;border:0;background:transparent;
    color:var(--ink-2);padding:8px 15px;font:inherit;font-size:13.5px;font-weight:550;cursor:pointer;
    border-radius:10px;letter-spacing:-.01em;transition:background .16s,color .16s;white-space:nowrap;position:relative}
  .seg button:hover{color:var(--ink);background:var(--paper-2)}
  .seg button.active{color:var(--card);background:var(--sea);box-shadow:var(--shadow-s)}

  /* ================= LAYOUT ================= */
  #content{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;overflow:auto;display:none;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain}
  .view.active{display:block;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 80px}

  h2{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;margin:0 0 6px;font-size:32px;line-height:1.12}
  .lead{color:var(--ink-2);margin:0 0 22px;font-size:14.5px;line-height:1.6;max-width:64ch}
  .h3{display:flex;align-items:center;gap:10px;font-size:11px;text-transform:uppercase;letter-spacing:.11em;
    color:var(--ink-3);font-weight:700;margin:30px 0 13px}
  .h3::after{content:'';flex:1;height:1px;background:var(--line)}
  .h3:first-child{margin-top:0}

  /* ================= HERO ================= */
  .hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 28px 28px;margin:0 0 18px;
    background:linear-gradient(145deg,#0E5C74 0%,#12809E 46%,#0E8A8B 100%);color:#fff;
    box-shadow:var(--shadow-l)}
  .hero::before{content:'';position:absolute;inset:0;opacity:.5;
    background:radial-gradient(120% 90% at 88% 6%,rgba(255,255,255,.32),transparent 58%),
               radial-gradient(90% 70% at 4% 100%,rgba(196,112,60,.4),transparent 62%)}
  .hero>*{position:relative}
  .hero .kick{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.82}
  .hero h1{font-family:var(--serif);font-size:clamp(30px,6.4vw,46px);font-weight:600;letter-spacing:-.028em;
    margin:8px 0 10px;line-height:1.05}
  .hero p{margin:0;font-size:14.5px;line-height:1.6;opacity:.94;max-width:52ch}
  .hero .rule{width:52px;height:3px;border-radius:2px;background:rgba(255,255,255,.6);margin:16px 0 0}

  /* ================= COUNTDOWNS ================= */
  .counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:14px;margin:0 0 6px}
  .count{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow-m)}
  .count::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .count .cl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
  .count .cn{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:5px}
  .count .cd{display:flex;align-items:baseline;gap:7px;margin-top:9px}
  .count .cd b{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--c)}
  .count .cd span{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .count .cs{font-size:12.5px;color:var(--ink-2);margin-top:7px}

  /* ================= MAP ================= */
  .mapcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);
    box-shadow:var(--shadow-m)}
  .maphd{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .maphd .mt{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
  .maphd .ms{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .mapbtn{margin-left:auto;appearance:none;border:1px solid var(--line-2);background:var(--paper);
    color:var(--ink-2);font:inherit;font-size:11.5px;font-weight:650;padding:6px 12px;border-radius:8px;cursor:pointer}
  .mapbtn:hover{background:var(--paper-2);color:var(--ink)}
  #map{height:340px;background:var(--paper-2);transition:height .3s ease}
  .mapcard.tall #map{height:min(74vh,660px)}
  .leaflet-container{background:var(--paper-2);font-family:inherit}
  .chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px;border-top:1px solid var(--line);background:var(--paper)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--ink-2);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;
    transition:border-color .15s,color .15s}
  .chip:hover{color:var(--ink);border-color:var(--line-2)}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
  .pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;
    align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
    border:2.5px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.32);cursor:pointer;transition:transform .14s}
  .pin span{transform:rotate(45deg)}
  .pin:hover{transform:rotate(-45deg) scale(1.14)}
  .dotpin{width:13px;height:13px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:var(--shadow-l)}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-popup-content{margin:14px 16px;font-size:13px;line-height:1.55;font-family:var(--sans)}
  .pp-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;padding:3px 8px;border-radius:5px;margin-bottom:8px}
  .pp-nm{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.015em}
  .pp-kind{color:var(--ink-2);font-size:12px;margin:2px 0 9px}
  .pp-row{margin:4px 0;font-size:12.5px}.pp-row b{color:var(--ink-3);font-weight:650}
  #mapfb{display:none;padding:16px}

  /* ================= CARDS ================= */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;
    box-shadow:var(--shadow-s);transition:box-shadow .2s,transform .2s}
  .card:hover{box-shadow:var(--shadow-m)}
  .card h4{margin:0 0 9px;font-size:14.5px;font-weight:650;letter-spacing:-.012em;display:flex;
    align-items:center;gap:8px}
  .card h4 .num{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--sea-wash);color:var(--sea);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .card ul{margin:0;padding-left:16px}
  .card li{font-size:12.8px;margin:6px 0;line-height:1.55;color:var(--ink-2)}
  .card li b{color:var(--ink);font-weight:650}
  .card p{margin:0;font-size:12.8px;color:var(--ink-2);line-height:1.55}

  .note{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:4px 20px 6px;margin:0 0 12px}
  .note li{font-size:13.2px;line-height:1.6;margin:11px 0;color:var(--ink)}
  .note li b{font-weight:650}
  .flag{display:flex;gap:11px;background:rgba(196,112,60,.09);border:1px solid rgba(196,112,60,.28);
    border-radius:14px;padding:13px 16px;font-size:13px;line-height:1.55;margin:0 0 12px}
  .flag .ic{flex:0 0 auto;font-size:15px;line-height:1.3}
  .good{background:rgba(47,125,79,.08);border:1px solid rgba(47,125,79,.26);border-radius:14px;
    padding:13px 16px;font-size:13px;line-height:1.55;margin:0 0 12px}
  .tbc{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--gold);
    background:rgba(168,132,47,.12);border:1px solid rgba(168,132,47,.3);border-radius:5px;
    padding:2px 6px;vertical-align:middle;text-transform:uppercase}
  .tbc.ok{color:var(--green);background:rgba(47,125,79,.1);border-color:rgba(47,125,79,.28)}
  .tbc.warn{color:var(--sun);background:rgba(196,112,60,.11);border-color:rgba(196,112,60,.3)}

  /* ================= ITINERARY ================= */
  .tl{position:relative;padding-left:2px}
  .acc{position:relative;border:1px solid var(--line);border-radius:var(--r);margin:0 0 11px;
    background:var(--card);box-shadow:var(--shadow-s);overflow:hidden;transition:box-shadow .2s}
  .acc.open{box-shadow:var(--shadow-m)}
  .acc-hd{display:flex;align-items:center;gap:14px;padding:15px 17px;cursor:pointer;user-select:none}
  .acc-hd:hover{background:var(--paper)}
  .ddate{flex:0 0 auto;min-width:58px;padding:9px 8px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;line-height:1.1;
    background:var(--c);box-shadow:var(--shadow-s)}
  .ddate small{font-size:8.5px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em;
    margin-top:3px;white-space:nowrap}
  .acc-nm{font-weight:650;font-size:15.5px;letter-spacing:-.014em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .acc-sub{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}
  .chev{margin-left:auto;flex:0 0 auto;color:var(--ink-3);transition:transform .22s;font-size:11px}
  .acc.open .chev{transform:rotate(90deg)}
  .acc-bd{display:none;padding:2px 17px 16px}
  .acc.open .acc-bd{display:block}
  .leg{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
  .leg .slot{flex:0 0 118px;color:var(--ink-3);font-size:11.5px;font-weight:700;padding-top:2px;
    letter-spacing:.02em;text-transform:uppercase}
  .leg .txt{flex:1;font-size:13.2px;line-height:1.55;color:var(--ink-2)}
  .leg .txt b{color:var(--ink);font-weight:650}
  @media(max-width:560px){.leg{flex-direction:column;gap:3px}.leg .slot{flex:none}}

  /* ================= WEDDINGS — invitation cards ================= */
  .inv{border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);
    box-shadow:var(--shadow-l);margin:0 0 26px}
  .inv-hd{position:relative;overflow:hidden;padding:34px 26px 30px;color:#fff;background:var(--g);text-align:center}
  .inv-hd::before{content:'';position:absolute;inset:0;
    background:radial-gradient(100% 80% at 50% -10%,rgba(255,255,255,.3),transparent 62%)}
  .inv-hd::after{content:'';position:absolute;inset:10px;border:1px solid rgba(255,255,255,.22);
    border-radius:16px;pointer-events:none}
  .inv-hd>*{position:relative}
  .mono{font-family:var(--serif);font-size:12.5px;letter-spacing:.3em;opacity:.8;font-weight:500}
  .orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 14px;
    font-size:10px;opacity:.75}
  .orn i{display:block;width:34px;height:1px;background:rgba(255,255,255,.55)}
  .inv-kick{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
  .inv-nm{font-family:var(--serif);font-size:clamp(30px,7vw,46px);font-weight:500;
    letter-spacing:-.02em;margin:10px 0 0;line-height:1.06}
  .inv-dt{font-size:12.5px;margin-top:12px;opacity:.95;letter-spacing:.04em}
  .inv-count{display:inline-flex;align-items:baseline;gap:6px;margin-top:18px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 16px;
    backdrop-filter:blur(6px)}
  .inv-count b{font-size:16px;font-weight:700}
  .inv-count span{font-size:11px;opacity:.92;font-weight:600;letter-spacing:.03em}
  .inv-bd{padding:24px 26px 26px}
  .inv-sub{margin:0 0 20px;font-size:14px;line-height:1.65;color:var(--ink-2);max-width:62ch}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 18px;background:var(--paper)}
  .fact{padding:13px 15px;border-right:1px solid var(--line)}
  .fact:last-child{border-right:0}
  .fact small{display:block;font-size:9px;color:var(--ink-3);text-transform:uppercase;
    letter-spacing:.11em;font-weight:700;margin-bottom:6px}
  .fact b{font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.008em}
  @media(max-width:620px){.fact{border-right:0;border-bottom:1px solid var(--line)}
    .fact:last-child{border-bottom:0}}

  .venue{border-left:3px solid var(--sea);padding:2px 0 2px 16px;margin:0 0 18px}
  .venue .vn{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.015em}
  .venue .vl{font-size:12.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.01em}
  .venue .vb{margin:9px 0 0;font-size:13px;line-height:1.6;color:var(--ink-2)}

  .btns{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 20px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;
    text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);
    border-radius:11px;padding:9px 15px;transition:all .16s}
  .btn span{color:var(--sea);font-size:10px}
  .btn:hover{background:var(--sea);border-color:var(--sea);color:#fff;transform:translateY(-1px);
    box-shadow:var(--shadow-m)}
  .btn:hover span{color:rgba(255,255,255,.85)}

  .sub-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);
    font-weight:700;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
  .line{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line small{flex:0 0 132px;font-size:11px;font-weight:700;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .line div{flex:1;font-size:13px;line-height:1.6;color:var(--ink-2)}
  .line div b{color:var(--ink);font-weight:650}
  @media(max-width:560px){.line{flex-direction:column;gap:4px}.line small{flex:none}}

  .gift{margin:20px 0 0;padding:15px 18px;background:var(--sea-wash);border-radius:14px;
    font-size:13px;line-height:1.6;color:var(--ink-2);border:1px solid var(--line)}

  /* ================= BOOKINGS ================= */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-s)}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
  .stat .v{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
  .stat .v small{font-size:13px;color:var(--ink-3);font-weight:400;font-family:var(--sans)}
  .bk{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px;
    margin:0 0 10px;box-shadow:var(--shadow-s);display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .bk .bi{flex:1;min-width:210px}
  .bk .bn{font-weight:650;font-size:14px;letter-spacing:-.01em}
  .bk .bd{font-size:12.4px;color:var(--ink-2);margin-top:4px;line-height:1.55}
  .bk .bp{text-align:right;flex:0 0 auto}
  .bk .bp .a{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.015em}
  .bk .bp .e{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .st{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    border-radius:5px;padding:3px 8px;margin-top:7px}
  .st.paid{color:var(--green);background:rgba(47,125,79,.11)}
  .st.dep{color:var(--gold);background:rgba(168,132,47,.13)}
  .st.due{color:var(--rose);background:rgba(176,74,70,.11)}
  .st.tbc{color:var(--ink-3);background:var(--paper-2)}
  .opt{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;
    box-shadow:var(--shadow-s);position:relative;overflow:hidden}
  .opt.best{border-color:var(--sea);box-shadow:0 0 0 1px var(--sea),var(--shadow-m)}
  .opt .tag{position:absolute;top:0;right:0;font-size:9.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:#fff;background:var(--sea);padding:4px 11px;border-radius:0 0 0 10px}
  .opt .on{font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--sea)}
  .opt .op{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.022em;margin:6px 0 2px}
  .opt .oq{font-size:11.5px;color:var(--ink-3)}
  .opt ul{margin:10px 0 0;padding-left:16px}

/* ---------------- MAP ---------------- */
let MAP=null, BOUNDS=null, MARK={};
try{
  const map = L.map('map',{zoomControl:true,minZoom:5,scrollWheelZoom:false});
  MAP = map;
  /* basemap follows the viewer's light/dark preference, live.
     The scheme is read back from CSS (--scheme) rather than matchMedia, so the
     tiles can never end up disagreeing with the palette the page actually rendered. */
  const isDark = () =>
    getComputedStyle(document.documentElement).getPropertyValue('--scheme').includes('dark');
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const tileURL = d => `https://{s}.basemaps.cartocdn.com/${d?'dark_all':'light_all'}/{z}/{x}/{y}{r}.png`;
  let tilesDark = isDark();
  let tiles = L.tileLayer(tileURL(tilesDark),
    {attribution:'© OpenStreetMap · © CARTO', subdomains:'abcd', maxZoom:19}).addTo(map);
  const swapTiles = want => {
    if(want === tilesDark) return;
    tilesDark = want;
    map.removeLayer(tiles);
    tiles = L.tileLayer(tileURL(want),
      {attribution:'© OpenStreetMap · © CARTO', subdomains:'abcd', maxZoom:19}).addTo(map);
    tiles.bringToBack();
  };
  const onScheme = () => swapTiles(isDark());
  if(mq && mq.addEventListener) mq.addEventListener('change', onScheme);
  else if(mq && mq.addListener) mq.addListener(onScheme);
  /* some browsers settle the preference after this script runs, and not all of
     them fire a change event for it — re-check over the first few seconds */
  [0, 400, 1200, 3000].forEach(t=>setTimeout(onScheme, t));

  LEGS.forEach(s=>{
    const style = s.mode==='ground' ? {color:'#C4703C',weight:3,opacity:.9}
                : s.mode==='sea'    ? {color:'#0E8A8B',weight:2.6,opacity:.9,dashArray:'2,7'}
                                    : {color:'#1D6FA5',weight:2.4,opacity:.85,dashArray:'3,8'};
    L.polyline([s.a,s.b],style).addTo(map).bindTooltip(s.label,{sticky:true});
  });

  const pts=[];
  STOPS.forEach(s=>{
    const col = PLACES[s.region].raw;
    const icon = s.big
      ? L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,28],
          html:`<div class="pin" style="background:${col}"><span>${s.n}</span></div>`})
      : L.divIcon({className:'',iconSize:[13,13],iconAnchor:[6,6],
          html:`<div class="dotpin" style="background:${col}"></div>`});
    const m = L.marker(s.ll,{icon}).addTo(map);
    m.bindPopup(`<span class="pp-tag" style="background:${col}">${PLACES[s.region].name}</span>`+
      `<div class="pp-nm">${s.city}</div><div class="pp-kind">${s.kind}</div>`+
      s.rows.map(r=>`<div class="pp-row"><b>${r[0]}:</b> ${r[1]}</div>`).join(''));
    MARK[s.city]=m; pts.push(s.ll);
  });

  BOUNDS = L.latLngBounds(pts).pad(.16);
  map.fitBounds(BOUNDS,{animate:false});

  $('chips').innerHTML = STOPS.filter(s=>s.big)
    .map(s=>`<button class="chip" data-c="${s.city}" style="--c:${PLACES[s.region].raw}"><i></i>${s.city}</button>`).join('')+
    `<button class="chip" data-fit="1" style="--c:var(--ink-3)"><i></i>Whole route</button>`;

  document.querySelectorAll('#chips .chip').forEach(el=>el.onclick=()=>{
    if(el.dataset.fit){ map.fitBounds(BOUNDS,{animate:true}); return; }
    const m = MARK[el.dataset.c];
    map.flyTo(m.getLatLng(), 11, {duration:.7});
    setTimeout(()=>m.openPopup(), 720);
  });

  window.fitMap = () => {
    if(!MAP || !BOUNDS) return;
    onScheme();                       /* keep the basemap in step with the palette */
    MAP.invalidateSize();
    if(MAP.getSize().y > 60) MAP.fitBounds(BOUNDS,{animate:false});
  };

  $('mapToggle').onclick = e => {
    const c = $('mapcard'); c.classList.toggle('tall');
    e.target.textContent = c.classList.contains('tall') ? 'Collapse' : 'Expand';
    setTimeout(fitMap, 340);
  };

  /* the map lives inside an absolutely-positioned view, so its box can settle
     after first paint — fit on every settle point rather than guessing one */
  requestAnimationFrame(()=>requestAnimationFrame(fitMap));
  [120, 400, 900].forEach(t=>setTimeout(fitMap, t));
  window.addEventListener('load', fitMap);
  window.addEventListener('resize', fitMap);
  if(window.ResizeObserver) new ResizeObserver(fitMap).observe($('map'));
}catch(err){
  const el = $('map'); if(el) el.style.display='none';
  const tog = $('mapToggle'); if(tog) tog.style.display='none';
  const fb = $('mapfb');
  fb.style.display='block';
  fb.innerHTML = '<div class="grid">'+ STOPS.map(s=>
    `<div class="card"><h4>${s.city}</h4><ul><li>${s.kind}</li>`+
    s.rows.map(r=>`<li><b>${r[0]}:</b> ${r[1]}</li>`).join('')+'</ul></div>').join('')+'</div>';
}

/* ---------------- INTERACTIONS ---------------- */
document.querySelectorAll('.acc-hd').forEach(hd=>

document.querySelectorAll('.seg button').forEach(b=>{

    document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    $('view-'+b.dataset.view).classList.add('active');
    document.querySelector('.view.active').scrollTop = 0;
    if(b.dataset.view==='home' && window.fitMap) setTimeout(window.fitMap,120);
  };
});
